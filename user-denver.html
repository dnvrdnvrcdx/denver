<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>User: Denver</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000000;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Arial, sans-serif;
    }

    .wrap {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Slight dark overlay for readability */
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.28);
      z-index: 2;
    }

    /* Text layer */
    .hero {
      position: absolute;
      inset: 0;
      z-index: 3;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      text-align: center;
      color: #ffffff;
      padding: 30px;
    }

    .title {
      margin: 0;

      font-size: clamp(4rem, 11vw, 11rem);
      font-weight: 900;
      letter-spacing: 0.04em;
      line-height: 0.95;

      text-shadow:
        0 0 10px rgba(255, 255, 255, 0.75),
        0 0 30px rgba(0, 255, 102, 0.4);
    }

    .tagline {
      margin-top: 30px;

      font-size: clamp(1rem, 2vw, 1.6rem);
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;

      color: #d9ffe7;

      text-shadow:
        0 0 8px rgba(0, 255, 102, 0.55);
    }
  </style>
</head>

<body>

  <div class="wrap">

    <canvas id="matrix"></canvas>

    <div class="overlay"></div>

    <div class="hero">

      <h1 class="title">
        USER: DENVER
      </h1>

      <div class="tagline">
        Digital Identity // Personal Profile
      </div>

    </div>

  </div>

  <script>
    (function(){

      var cfg = {
        "charset": "01",
        "width": 1920,
        "height": 1080,
        "fontSize": 16,
        "speed": 35,
        "fade": 0.08,
        "textColor": "#00ff66",
        "bgColor": "#000000",
        "glow": true,
        "glowStrength": 16,
        "fullpage": true
      };

      var canvas = document.getElementById("matrix");
      var ctx = canvas.getContext("2d");

      var dpr = window.devicePixelRatio || 1;
      var cols = 0;
      var drops = [];

      function rgbFromHex(hex) {
        return [
          parseInt(hex.slice(1, 3), 16),
          parseInt(hex.slice(3, 5), 16),
          parseInt(hex.slice(5, 7), 16)
        ];
      }

      function resize() {

        var rect = canvas.getBoundingClientRect();

        canvas.width = Math.floor(rect.width * dpr);
        canvas.height = Math.floor(rect.height * dpr);

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        cols = Math.max(
          1,
          Math.floor(rect.width / cfg.fontSize)
        );

        drops = new Array(cols).fill(1);
      }

      function pickChar() {

        return cfg.charset.charAt(
          Math.floor(
            Math.random() * cfg.charset.length
          )
        );

      }

      function draw() {

        var rect = canvas.getBoundingClientRect();

        var rgb = rgbFromHex(cfg.bgColor);

        ctx.fillStyle =
          "rgba(" +
          rgb[0] + "," +
          rgb[1] + "," +
          rgb[2] + "," +
          cfg.fade +
          ")";

        ctx.fillRect(
          0,
          0,
          rect.width,
          rect.height
        );

        ctx.font =
          cfg.fontSize +
          "px monospace";

        ctx.fillStyle =
          cfg.textColor;

        if (cfg.glow) {

          ctx.shadowColor =
            cfg.textColor;

          ctx.shadowBlur =
            cfg.glowStrength;

        } else {

          ctx.shadowBlur = 0;

        }

        for (var i = 0; i < drops.length; i++) {

          ctx.fillText(
            pickChar(),
            i * cfg.fontSize,
            drops[i] * cfg.fontSize
          );

          if (
            drops[i] * cfg.fontSize >
              rect.height &&
            Math.random() > 0.975
          ) {

            drops[i] = 0;

          }

          drops[i]++;
        }

      }

      resize();

      window.addEventListener(
        "resize",
        resize
      );

      setInterval(
        draw,
        cfg.speed
      );

    })();
  </script>

</body>
</html>
