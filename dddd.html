<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Love You</title>

<style>
* {
margin: 0;
padding: 0;
box-sizing: border-box;
user-select: none;
}

html, body {
width: 100%;
height: 100%;
overflow: hidden;
background: #000;
font-family: Arial, sans-serif;
}

canvas {
display: block;
width: 100vw;
height: 100vh;
}
</style>
</head>

<body>

<canvas id="c"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

let W, H, CX, CY, SCALE;

const DPR = Math.min(window.devicePixelRatio || 1, 2);
const text = "I love you";
const points = [];
const TOTAL = 95;

function resize() {
W = window.innerWidth;
H = window.innerHeight;

canvas.width = W * DPR;
canvas.height = H * DPR;

canvas.style.width = W + "px";
canvas.style.height = H + "px";

ctx.setTransform(1, 0, 0, 1, 0, 0);
ctx.scale(DPR, DPR);

CX = W / 2;
CY = H / 2 + 20;
SCALE = Math.min(W, H) * 0.014;

buildPoints();
}

function heart(t) {
const x = 16 * Math.pow(Math.sin(t), 3);
const y =
13 * Math.cos(t)
- 5 * Math.cos(2 * t)
- 2 * Math.cos(3 * t)
- Math.cos(4 * t);

return {
x: x * SCALE,
y: -y * SCALE
};
}

function buildPoints() {
points.length = 0;

for (let i = 0; i < TOTAL; i++) {
const t = (i / TOTAL) * Math.PI * 2;

points.push({
baseT: t,
phase: Math.random() * Math.PI * 2,
speed: 0.5 + Math.random() * 0.5,
size: 1.2 + Math.random() * 1.8
});
}
}

function glowText(txt, x, y, angle, size, alpha = 1) {
ctx.save();

ctx.translate(x, y);
ctx.rotate(angle);

ctx.font = `bold ${size}px Arial, sans-serif`;
ctx.textAlign = "center";
ctx.textBaseline = "middle";

ctx.shadowColor = "rgba(255, 120, 190, 0.95)";
ctx.shadowBlur = 15;

ctx.fillStyle = `rgba(255, 120, 190, ${alpha})`;
ctx.fillText(txt, 0, 0);

ctx.shadowBlur = 30;
ctx.fillStyle = `rgba(255, 180, 220, ${alpha * 0.35})`;
ctx.fillText(txt, 0, 0);

ctx.restore();
}

function drawHeart(time) {
for (let i = 0; i < points.length; i++) {
const p = points[i];

const t =
p.baseT +
Math.sin(time * 0.001 * p.speed + p.phase) * 0.015;

const pos = heart(t);

const floatX =
Math.sin(time * 0.001 + p.phase) * 1.5;

const floatY =
Math.cos(time * 0.0012 + p.phase) * 1.5;

const x = CX + pos.x + floatX;
const y = CY + pos.y + floatY;

const pulse =
0.75 +
Math.sin(time * 0.003 + p.phase) * 0.25;

const size = p.size * pulse;

ctx.beginPath();

ctx.arc(
x,
y,
size,
0,
Math.PI * 2
);

ctx.fillStyle =
`rgba(255, 120, 190, ${0.65 + pulse * 0.35})`;

ctx.shadowColor =
"rgba(255, 100, 180, 0.9)";

ctx.shadowBlur = 8;

ctx.fill();
}
}

function animate(time) {
ctx.clearRect(0, 0, W, H);

drawHeart(time);

const textPulse =
1 + Math.sin(time * 0.002) * 0.04;

const textSize =
Math.min(W, H) * 0.07 * textPulse;

glowText(
text,
CX,
CY,
0,
textSize,
1
);

requestAnimationFrame(animate);
}

window.addEventListener("resize", resize);

resize();
requestAnimationFrame(animate);
</script>

</body>
</html>
