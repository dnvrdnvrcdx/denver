<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RetroLens Engine (fixed)</title>

  <!-- MediaPipe for browser-based hand tracking (kept, optional) -->
  <script type="module">
    import {
      HandLandmarker,
      FilesetResolver
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm";

    // Expose to window if the import succeeds — the app will try to use them but won't block if not.
    window.HandLandmarker = HandLandmarker;
    window.FilesetResolver = FilesetResolver;

    // signal that mediapipe script loaded
    window.dispatchEvent(new Event('mediapipe-ready'));
  </script>

  <style>
    * { box-sizing: border-box }
    html,body { height: 100%; margin: 0; background: #050505; color: white; font-family: Arial, Helvetica, sans-serif}
    #app { width:100vw; height:100vh; display:flex; align-items:center; justify-content:center; position:relative }
    #video { display:none }
    #canvas { background:black; width:min(100vw,177.78vh); height:min(56.25vw,100vh); object-fit:contain }
    #startScreen { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; background:radial-gradient(circle,#151515,#020202); z-index:10 }
    button { border:1px solid #00ffff; background:transparent; color:#00ffff; padding:13px 25px; font-size:16px; cursor:pointer; border-radius:4px }
    button:disabled { opacity:0.6; cursor:default }
    #loading { margin-top:18px; color:#888; display:none }
    #error { color:#ff5555; margin-top:12px; display:none; max-width:600px; text-align:center }
  </style>
</head>
<body>
  <div id="app">
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas" width="960" height="540"></canvas>

    <div id="startScreen">
      <h1>RETROLENS</h1>
      <p>Hand-controlled visual portal engine</p>

      <button id="startButton">START CAMERA</button>

      <div id="loading">Loading hand-tracking model...</div>
      <div id="error"></div>
    </div>
  </div>

  <script>
    // Minimal robust start: start camera immediately, then load heavy model in background with a timeout.

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const startScreen = document.getElementById('startScreen');
    const startButton = document.getElementById('startButton');
    const loadingText = document.getElementById('loading');
    const errorText = document.getElementById('error');

    const WIDTH = 960, HEIGHT = 540;
    canvas.width = WIDTH; canvas.height = HEIGHT;

    let handLandmarker = null;
    let running = false;
    let activeFilterIndex = 0;
    const filters = ['dual-tone','thermal','sketch','pixelate','glitch','invert','red-channel','edge','blur','cartoon','rainbow-wave'];

    function currentFilter() { return filters[activeFilterIndex] }

    // Simple non-blocking model loader with timeout. If it fails, app continues without hand tracking.
    async function loadHandModelWithTimeout(timeoutMs = 20000) {
      loadingText.style.display = 'block';
      loadingText.textContent = 'Loading hand-tracking model...';

      const initPromise = (async () => {
        // If MediaPipe objects are available, try to initialize; otherwise bail quickly.
        if (!window.FilesetResolver || !window.HandLandmarker) {
          // Nothing to initialize here (module didn't load or not supported). Resolve quickly.
          console.warn('MediaPipe modules not available; skipping model init.');
          return null;
        }

        try {
          // Attempt to create a small fileset and landmarker. The exact model asset path may vary and can be
          // customized by the project owner. We'll try a standard approach but guard errors.
          const fileset = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm');

          // Provide a concrete modelAssetPath. If you prefer to host the .task yourself, replace this URL.
          // This is the common public sample location used by MediaPipe examples.
          const modelUrl = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker.task';

          handLandmarker = await HandLandmarker.createFromOptions({
            filesetResolver: fileset,
            baseOptions: {
              modelAssetPath: modelUrl
            },
            runningMode: 'VIDEO',
            numHands: 2
          });

          console.log('HandLandmarker initialized');
          return handLandmarker;
        } catch (err) {
          // If any error happens during model init, bubble it up to be handled by the caller.
          console.error('Error initializing HandLandmarker:', err);
          throw err;
        }
      })();

      const timeoutPromise = new Promise((_, reject) => setTimeout(() => reject(new Error('Model load timed out')), timeoutMs));

      try {
        await Promise.race([initPromise, timeoutPromise]);
        loadingText.style.display = 'none';
        return true;
      } catch (err) {
        console.warn('Model failed to initialize or timed out:', err);
        loadingText.style.display = 'none';
        errorText.style.display = 'block';
        errorText.textContent = 'Hand model failed to load: ' + (err && err.message ? err.message : err);
        return false;
      }
    }

    // Very small, fast filter pipeline: draw video to an offscreen canvas and optionally apply a trivial effect
    const filterCanvas = document.createElement('canvas');
    filterCanvas.width = WIDTH; filterCanvas.height = HEIGHT;
    const filterCtx = filterCanvas.getContext('2d');

    function applySimpleFilter(source) {
      // For performance keep this simple: copy source -> filter canvas, then adjust brightness/contrast for some filters.
      filterCtx.clearRect(0,0,WIDTH,HEIGHT);
      filterCtx.drawImage(source, 0, 0, WIDTH, HEIGHT);

      const name = currentFilter();

      if (name === 'invert') {
        const data = filterCtx.getImageData(0,0,WIDTH,HEIGHT);
        for (let i=0;i<data.data.length;i+=4) {
          data.data[i] = 255 - data.data[i];
          data.data[i+1] = 255 - data.data[i+1];
          data.data[i+2] = 255 - data.data[i+2];
        }
        filterCtx.putImageData(data,0,0);
      }
      // other filters can be added later; for now we support 'invert' and plain passthrough

      return filterCanvas;
    }

    // Render loop: draw either processed frame or raw video. If the model is ready, run detection and draw landmarks.
    async function renderLoop() {
      if (!running) return;

      ctx.clearRect(0,0,WIDTH,HEIGHT);
      // Draw the filtered video background first
      const processed = applySimpleFilter(video);
      ctx.drawImage(processed, 0, 0, WIDTH, HEIGHT);

      // If model is ready, run detection and draw landmarks
      if (handLandmarker) {
        try {
          const results = await handLandmarker.detectForVideo(video, performance.now());
          if (results && results.landmarks) {
            ctx.fillStyle = 'rgba(0,255,0,0.95)';
            ctx.strokeStyle = 'rgba(0,255,0,0.6)';
            ctx.lineWidth = 2;
            for (const hand of results.landmarks) {
              for (const pt of hand) {
                // MediaPipe gives normalized coordinates (x,y) in [0,1]
                ctx.beginPath();
                ctx.arc(pt.x * WIDTH, pt.y * HEIGHT, 4, 0, Math.PI * 2);
                ctx.fill();
              }
              // Optionally connect landmarks in sequence
              for (let i = 1; i < hand.length; i++) {
                const a = hand[i-1], b = hand[i];
                ctx.beginPath();
                ctx.moveTo(a.x * WIDTH, a.y * HEIGHT);
                ctx.lineTo(b.x * WIDTH, b.y * HEIGHT);
                ctx.stroke();
              }
            }
          }
        } catch (err) {
          // If detection fails, log and continue rendering background.
          console.warn('Hand detection error:', err);
        }
      }

      requestAnimationFrame(renderLoop);
    }

    // Robust start handler: start camera immediately at low resolution, then load model in background.
    startButton.addEventListener('click', async () => {
      startButton.disabled = true;
      loadingText.style.display = 'block';
      loadingText.textContent = 'Starting camera...';

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 360 }, audio: false });
        video.muted = true;
        video.srcObject = stream;
        await video.play();

        startScreen.style.display = 'none';
        running = true;
        loadingText.textContent = 'Loading hand-tracking model...';

        // Start model load in background but don't block the UI. Proceed regardless of success.
        loadHandModelWithTimeout(20000).then(ok => {
          if (!ok) console.warn('Continuing without hand tracking');
        });

        requestAnimationFrame(renderLoop);
      } catch (err) {
        console.error('Could not open camera:', err);
        loadingText.style.display = 'none';
        startButton.disabled = false;
        errorText.style.display = 'block';
        errorText.textContent = 'Could not open camera: ' + (err && err.message ? err.message : err);
      }
    });

    // allow keyboard to cycle filters so you can test visuals quickly
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') { activeFilterIndex = (activeFilterIndex + 1) % filters.length }
      if (e.key === 'ArrowLeft') { activeFilterIndex = (activeFilterIndex - 1 + filters.length) % filters.length }
    });

    // Debug helpers
    window.addEventListener('mediapipe-ready', () => console.log('mediapipe module loaded'));
    console.log('FilesetResolver present?', !!window.FilesetResolver, 'HandLandmarker present?', !!window.HandLandmarker);

  </script>
</body>
</html>
