<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>RetroLens Engine</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
}

#app {
    position: fixed;
    inset: 0;
    background: #000;
}

#canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
}

#video {
    display: none;
}

#startScreen {
    position: fixed;
    inset: 0;
    z-index: 20;

    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;

    background:
        radial-gradient(circle at center,
        #171717 0%,
        #050505 45%,
        #000 100%);

    color: white;
    text-align: center;
}

#startScreen h1 {
    margin: 0 0 8px;

    font-size: clamp(38px, 8vw, 72px);
    letter-spacing: 5px;
}

#startScreen p {
    margin: 0 0 25px;
    color: #999;
}

button {
    padding: 14px 26px;

    border: 1px solid #00ffff;
    border-radius: 5px;

    background: transparent;
    color: #00ffff;

    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #00ffff;
    color: #000;
}

button:disabled {
    opacity: 0.5;
}

#status {
    margin-top: 15px;
    color: #777;
    font-size: 13px;
}

#error {
    max-width: 600px;
    margin-top: 15px;
    color: #ff5555;
    display: none;
}

#loading {
    display: none;
}

</style>
</head>

<body>

<div id="app">

    <video id="video"
           autoplay
           muted
           playsinline></video>

    <canvas id="canvas"></canvas>

    <div id="startScreen">

        <h1>RETROLENS</h1>

        <p>
            Hand-controlled visual portal engine
        </p>

        <button id="startButton">
            START CAMERA
        </button>

        <div id="status">
            Camera offline
        </div>

        <div id="loading">
            Loading hand tracking...
        </div>

        <div id="error"></div>

    </div>

</div>


<script type="module">

/*
============================================================
RETROLENS V2
Optimized browser version

Major changes:
- Lower-resolution processing buffer
- Hand detection throttled
- Camera rendering separated from detection
- Filters only process portal regions
- No full-frame pixel filter every frame
- GPU-friendly canvas operations
============================================================
*/


/* =========================================================
   MEDIAPIPE
========================================================= */

import {
    HandLandmarker,
    FilesetResolver
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm";


/* =========================================================
   ELEMENTS
========================================================= */

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d", {
        alpha: false,
        desynchronized: true
    });

const startScreen =
    document.getElementById("startScreen");

const startButton =
    document.getElementById("startButton");

const statusText =
    document.getElementById("status");

const loadingText =
    document.getElementById("loading");

const errorText =
    document.getElementById("error");


/* =========================================================
   PROCESSING RESOLUTION
========================================================= */

/*
    The display can still be large.

    Processing is deliberately smaller because
    hand tracking does not need 960x540.
*/

const PROCESS_WIDTH = 640;
const PROCESS_HEIGHT = 360;


/* =========================================================
   CANVAS
========================================================= */

canvas.width =
    PROCESS_WIDTH;

canvas.height =
    PROCESS_HEIGHT;


/* =========================================================
   OFFSCREEN CANVASES
========================================================= */

const frameCanvas =
    document.createElement("canvas");

frameCanvas.width =
    PROCESS_WIDTH;

frameCanvas.height =
    PROCESS_HEIGHT;

const frameCtx =
    frameCanvas.getContext("2d", {
        alpha: false
    });


const portalCanvas =
    document.createElement("canvas");

const portalCtx =
    portalCanvas.getContext("2d");


/* =========================================================
   SETTINGS
========================================================= */

const PINCH_THRESHOLD =
    0.07;

const FIST_THRESHOLD =
    0.135;

const FILTER_COOLDOWN =
    350;

const MODE_COOLDOWN =
    1200;


/*
    Hand detection frequency.

    10 FPS is enough for gesture recognition
    while greatly reducing CPU usage.
*/

const HAND_INTERVAL =
    100;


/* =========================================================
   STATE
========================================================= */

let handLandmarker =
    null;

let cameraStream =
    null;

let running =
    false;

let handDetectionBusy =
    false;

let lastHandDetection =
    0;

let lastFilterChange =
    0;

let lastModeChange =
    0;

let activeFilter =
    0;

let mode3D =
    false;

let detectedHands =
    [];

let fps =
    0;

let lastFrameTime =
    performance.now();

let frameCounter =
    0;


/* =========================================================
   FILTERS
========================================================= */

const filters = [

    "dual-tone",
    "thermal",
    "sketch",
    "pixelate",
    "glitch",
    "invert",
    "red-channel",
    "edge",
    "blur",
    "cartoon",
    "rainbow-wave"

];


function currentFilter() {

    return filters[activeFilter];

}


function nextFilter(amount = 1) {

    activeFilter =
        (
            activeFilter +
            amount +
            filters.length
        ) %
        filters.length;

}


/* =========================================================
   CAMERA
========================================================= */

async function startCamera() {

    try {

        startButton.disabled =
            true;

        statusText.textContent =
            "Starting camera...";


        cameraStream =
            await navigator.mediaDevices.getUserMedia({

                video: {

                    width: {
                        ideal: 640
                    },

                    height: {
                        ideal: 360
                    },

                    frameRate: {
                        ideal: 30,
                        max: 30
                    },

                    facingMode: "user"

                },

                audio: false

            });


        video.srcObject =
            cameraStream;


        await video.play();


        statusText.textContent =
            "Camera ready";


        /*
            Show camera immediately.
        */

        running =
            true;

        startScreen.style.display =
            "none";


        requestAnimationFrame(
            renderLoop
        );


        /*
            Load MediaPipe AFTER camera starts.
        */

        loadingText.style.display =
            "block";

        statusText.textContent =
            "Loading hand tracking...";


        await loadHandTracking();


        loadingText.style.display =
            "none";


        statusText.textContent =
            "Hand tracking ready";


    } catch (error) {

        console.error(error);

        running =
            false;

        startButton.disabled =
            false;

        loadingText.style.display =
            "none";

        errorText.style.display =
            "block";

        errorText.textContent =
            error.message ||
            "Unable to start camera.";

    }

}


/* =========================================================
   MEDIAPIPE
========================================================= */

async function loadHandTracking() {

    const vision =
        await FilesetResolver.forVisionTasks(

            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"

        );


    handLandmarker =
        await HandLandmarker.createFromOptions(

            vision,

            {

                baseOptions: {

                    modelAssetPath:
                        "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",

                    delegate:
                        "GPU"

                },

                runningMode:
                    "VIDEO",

                numHands:
                    2,

                minHandDetectionConfidence:
                    0.7,

                minHandPresenceConfidence:
                    0.7,

                minTrackingConfidence:
                    0.7

            }

        );

}


/* =========================================================
   MAIN RENDER LOOP
========================================================= */

function renderLoop(timestamp) {

    if (!running)
        return;


    /*
        Draw camera.
    */

    frameCtx.save();

    /*
        Mirror camera.
    */

    frameCtx.translate(
        PROCESS_WIDTH,
        0
    );

    frameCtx.scale(
        -1,
        1
    );

    frameCtx.drawImage(

        video,

        0,
        0,

        PROCESS_WIDTH,
        PROCESS_HEIGHT

    );

    frameCtx.restore();


    /*
        Copy processing frame
        to visible canvas.
    */

    ctx.drawImage(
        frameCanvas,
        0,
        0
    );


    /*
        Hand detection is throttled.

        This is the BIG CPU optimization.
    */

    if (

        handLandmarker &&

        !handDetectionBusy &&

        timestamp -
        lastHandDetection >
        HAND_INTERVAL

    ) {

        detectHands(timestamp);

    }


    /*
        Draw effects.
    */

    drawPortals();


    drawHUD();


    /*
        FPS.
    */

    frameCounter++;

    if (
        timestamp -
        lastFrameTime >
        1000
    ) {

        fps =
            frameCounter;

        frameCounter =
            0;

        lastFrameTime =
            timestamp;

    }


    requestAnimationFrame(
        renderLoop
    );

}


/* =========================================================
   HAND DETECTION
========================================================= */

async function detectHands(timestamp) {

    handDetectionBusy =
        true;

    lastHandDetection =
        timestamp;


    try {

        const result =
            handLandmarker.detectForVideo(

                video,

                timestamp

            );


        detectedHands =
            result.landmarks || [];


        processGestures();


    } catch (error) {

        console.warn(
            "Hand tracking:",
            error
        );

    }


    handDetectionBusy =
        false;

}


/* =========================================================
   GESTURES
========================================================= */

function processGestures() {

    const now =
        performance.now();

    let fists =
        0;


    for (
        const hand of detectedHands
    ) {

        /*
            Thumb/index pinch.
        */

        const pinch =
            landmarkDistance(
                hand[4],
                hand[8]
            );


        if (

            pinch <
            PINCH_THRESHOLD &&

            now -
            lastFilterChange >
            FILTER_COOLDOWN

        ) {

            nextFilter();

            lastFilterChange =
                now;

        }


        /*
            Fist.
        */

        if (
            isFist(hand)
        ) {

            fists++;

        }

    }


    /*
        Two fists toggle mode.
    */

    if (

        fists === 2 &&

        now -
        lastModeChange >
        MODE_COOLDOWN

    ) {

        mode3D =
            !mode3D;

        lastModeChange =
            now;

    }

}


/* =========================================================
   LANDMARK DISTANCE
========================================================= */

function landmarkDistance(a, b) {

    const dx =
        a.x -
        b.x;

    const dy =
        a.y -
        b.y;

    return Math.sqrt(
        dx * dx +
        dy * dy
    );

}


/* =========================================================
   FIST DETECTION
========================================================= */

function isFist(hand) {

    const wrist =
        hand[0];

    const tips = [

        hand[8],
        hand[12],
        hand[16],
        hand[20]

    ];


    let total =
        0;


    for (
        const tip of tips
    ) {

        total +=
            landmarkDistance(
                wrist,
                tip
            );

    }


    return (
        total /
        tips.length
    ) <
    FIST_THRESHOLD;

}


/* =========================================================
   POINT CONVERSION
========================================================= */

function handPoints(hand) {

    const ids = [
        4,
        8,
        12,
        16,
        20
    ];


    return ids.map(

        id => ({

            x:
                hand[id].x *
                PROCESS_WIDTH,

            y:
                hand[id].y *
                PROCESS_HEIGHT

        })

    );

}


/* =========================================================
   QUAD SORT
========================================================= */

function sortQuad(points) {

    const sorted =
        [...points].sort(
            (a, b) =>
                a.x - b.x
        );


    const left =
        sorted
            .slice(0, 2)
            .sort(
                (a, b) =>
                    a.y - b.y
            );


    const right =
        sorted
            .slice(2)
            .sort(
                (a, b) =>
                    a.y - b.y
            );


    return [

        left[0],
        right[0],
        right[1],
        left[1]

    ];

}


/* =========================================================
   ROTATION CHECK
========================================================= */

function rotated(
    thumb,
    index
) {

    const dx =
        index.x -
        thumb.x;

    const dy =
        index.y -
        thumb.y;


    return (

        dy >
        PROCESS_HEIGHT * 0.045 ||

        Math.abs(dx) >
        Math.abs(dy) * 1.1

    );

}


/* =========================================================
   PORTAL DRAWING
========================================================= */

function drawPortals() {

    if (
        detectedHands.length === 0
    )
        return;


    const hands =
        detectedHands.map(
            handPoints
        );


    if (mode3D) {

        draw3DPortal(hands);

    } else {

        draw2DPortal(hands);

    }

}


/* =========================================================
   2D PORTAL
========================================================= */

function draw2DPortal(hands) {

    if (
        hands.length === 2
    ) {

        const corners = [

            hands[0][0],
            hands[0][1],
            hands[1][0],
            hands[1][1]

        ];


        let quad;


        if (

            rotated(
                hands[0][0],
                hands[0][1]
            ) ||

            rotated(
                hands[1][0],
                hands[1][1]
            )

        ) {

            /*
                Bowtie mode.
            */

            const sorted =
                [...corners].sort(
                    (a, b) =>
                        a.x - b.x
                );


            const left =
                sorted
                    .slice(0, 2)
                    .sort(
                        (a, b) =>
                            a.y - b.y
                    );


            const right =
                sorted
                    .slice(2)
                    .sort(
                        (a, b) =>
                            a.y - b.y
                    );


            quad = [

                left[0],
                right[1],
                right[0],
                left[1]

            ];

        } else {

            quad =
                sortQuad(
                    corners
                );

        }


        drawFilteredPortal(
            quad,
            currentFilter()
        );


    } else if (
        hands.length === 1
    ) {

        drawFilteredPortal(

            [

                hands[0][0],
                hands[0][1],
                hands[0][2],
                hands[0][4]

            ],

            currentFilter()

        );

    }

}


/* =========================================================
   3D PORTAL
========================================================= */

function draw3DPortal(hands) {

    if (
        hands.length === 2
    ) {

        const a =
            hands[0];

        const b =
            hands[1];


        drawFilteredPortal(

            [

                a[0],
                a[1],
                a[2],
                b[2],
                b[1],
                b[0]

            ],

            currentFilter()

        );


        drawFilteredPortal(

            [

                a[2],
                a[3],
                a[4],
                b[4],
                b[3],
                b[2]

            ],

            filters[
                (activeFilter + 1) %
                filters.length
            ]

        );


    } else if (
        hands.length === 1
    ) {

        drawFilteredPortal(

            [

                hands[0][0],
                hands[0][1],
                hands[0][2],
                hands[0][4]

            ],

            currentFilter()

        );

    }

}


/* =========================================================
   FILTERED PORTAL
========================================================= */

function drawFilteredPortal(
    points,
    filter
) {

    if (
        points.length < 4
    )
        return;


    /*
        Find bounding box.
    */

    let minX =
        PROCESS_WIDTH;

    let minY =
        PROCESS_HEIGHT;

    let maxX =
        0;

    let maxY =
        0;


    for (
        const p of points
    ) {

        minX =
            Math.min(
                minX,
                p.x
            );

        minY =
            Math.min(
                minY,
                p.y
            );

        maxX =
            Math.max(
                maxX,
                p.x
            );

        maxY =
            Math.max(
                maxY,
                p.y
            );

    }


    minX =
        Math.max(
            0,
            Math.floor(minX)
        );

    minY =
        Math.max(
            0,
            Math.floor(minY)
        );

    maxX =
        Math.min(
            PROCESS_WIDTH,
            Math.ceil(maxX)
        );

    maxY =
        Math.min(
            PROCESS_HEIGHT,
            Math.ceil(maxY)
        );


    const width =
        maxX -
        minX;

    const height =
        maxY -
        minY;


    if (
        width < 10 ||
        height < 10
    )
        return;


    /*
        Resize temporary canvas
        ONLY to portal size.
    */

    if (

        portalCanvas.width !== width ||
        portalCanvas.height !== height

    ) {

        portalCanvas.width =
            width;

        portalCanvas.height =
            height;

    }


    portalCtx.clearRect(
        0,
        0,
        width,
        height
    );


    /*
        Draw only the portal region.
    */

    portalCtx.drawImage(

        frameCanvas,

        minX,
        minY,
        width,
        height,

        0,
        0,
        width,
        height

    );


    /*
        Apply lightweight browser filter.
    */

    applyFastFilter(
        portalCtx,
        width,
        height,
        filter
    );


    /*
        Clip to hand polygon.
    */

    ctx.save();

    ctx.beginPath();


    ctx.moveTo(

        points[0].x,
        points[0].y

    );


    for (
        let i = 1;
        i < points.length;
        i++
    ) {

        ctx.lineTo(

            points[i].x,
            points[i].y

        );

    }


    ctx.closePath();

    ctx.clip();


    ctx.drawImage(

        portalCanvas,

        minX,
        minY

    );


    ctx.restore();


    /*
        Portal border.
    */

    ctx.save();

    ctx.beginPath();

    ctx.moveTo(
        points[0].x,
        points[0].y
    );


    for (
        let i = 1;
        i < points.length;
        i++
    ) {

        ctx.lineTo(
            points[i].x,
            points[i].y
        );

    }


    ctx.closePath();


    ctx.strokeStyle =
        "rgba(255,255,255,0.95)";

    ctx.lineWidth =
        2;

    ctx.stroke();

    ctx.restore();

}


/* =========================================================
   FAST FILTERS
========================================================= */

function applyFastFilter(
    context,
    width,
    height,
    filter
) {

    switch (filter) {

        case "invert":

            context.filter =
                "invert(1)";

            redraw(context);

            break;


        case "blur":

            context.filter =
                "blur(8px)";

            redraw(context);

            break;


        case "thermal":

            context.filter =
                "contrast(1.4) saturate(3) hue-rotate(180deg)";

            redraw(context);

            break;


        case "red-channel":

            context.filter =
                "grayscale(1) sepia(1) saturate(5) hue-rotate(315deg)";

            redraw(context);

            break;


        case "sketch":

            context.filter =
                "grayscale(1) contrast(2) brightness(1.2)";

            redraw(context);

            break;


        case "cartoon":

            context.filter =
                "contrast(1.35) saturate(1.5)";

            redraw(context);

            break;


        case "dual-tone":

            context.filter =
                "contrast(1.5) saturate(1.7)";

            redraw(context);

            break;


        case "pixelate":

            pixelateCanvas(
                context,
                width,
                height
            );

            break;


        case "glitch":

            glitchCanvas(
                context,
                width,
                height
            );

            break;


        case "edge":

            context.filter =
                "grayscale(1) contrast(3)";

            redraw(context);

            break;


        case "rainbow-wave":

            rainbowCanvas(
                context,
                width,
                height
            );

            break;


        default:

            break;

    }


    context.filter =
        "none";

}


/* =========================================================
   REDRAW FILTER
========================================================= */

function redraw(context) {

    const canvas =
        context.canvas;

    context.drawImage(
        canvas,
        0,
        0
    );

}


/* =========================================================
   PIXELATE
========================================================= */

function pixelateCanvas(
    context,
    width,
    height
) {

    const source =
        context.getImageData(
            0,
            0,
            width,
            height
        );


    const data =
        source.data;

    const block =
        10;


    for (
        let y = 0;
        y < height;
        y += block
    ) {

        for (
            let x = 0;
            x < width;
            x += block
        ) {

            const index =
                (
                    y * width +
                    x
                ) * 4;


            const r =
                data[index];

            const g =
                data[index + 1];

            const b =
                data[index + 2];


            for (
                let yy = y;
                yy < Math.min(
                    y + block,
                    height
                );
                yy++
            ) {

                for (
                    let xx = x;
                    xx < Math.min(
                        x + block,
                        width
                    );
                    xx++
                ) {

                    const i =
                        (
                            yy *
                            width +
                            xx
                        ) * 4;


                    data[i] =
                        r;

                    data[i + 1] =
                        g;

                    data[i + 2] =
                        b;

                }

            }

        }

    }


    context.putImageData(
        source,
        0,
        0
    );

}


/* =========================================================
   GLITCH
========================================================= */

function glitchCanvas(
    context,
    width,
    height
) {

    const source =
        context.getImageData(
            0,
            0,
            width,
            height
        );


    context.clearRect(
        0,
        0,
        width,
        height
    );


    context.putImageData(
        source,
        Math.floor(
            Math.random() * 10
        ) - 5,
        0
    );


    /*
        RGB-like overlay.
    */

    context.globalCompositeOperation =
        "screen";

    context.globalAlpha =
        0.25;


    context.putImageData(
        source,
        Math.floor(
            Math.random() * 10
        ) - 5,
        0
    );


    context.globalAlpha =
        1;

    context.globalCompositeOperation =
        "source-over";


    /*
        Random scanline.
    */

    context.fillStyle =
        "rgba(255,255,255,0.4)";


    for (
        let i = 0;
        i < 2;
        i++
    ) {

        const y =
            Math.random() *
            height;

        context.fillRect(
            0,
            y,
            width,
            1
        );

    }

}


/* =========================================================
   RAINBOW
========================================================= */

function rainbowCanvas(
    context,
    width,
    height
) {

    /*
        Lightweight overlay instead of
        recalculating every pixel.
    */

    const gradient =
        context.createLinearGradient(
            0,
            0,
            width,
            height
        );


    const t =
        (
            performance.now() *
            0.0005
        ) % 1;


    gradient.addColorStop(
        0,
        `hsla(${t * 360},100%,50%,0.45)`
    );


    gradient.addColorStop(
        0.25,
        `hsla(${(t * 360 + 90) % 360},100%,50%,0.45)`
    );


    gradient.addColorStop(
        0.5,
        `hsla(${(t * 360 + 180) % 360},100%,50%,0.45)`
    );


    gradient.addColorStop(
        0.75,
        `hsla(${(t * 360 + 270) % 360},100%,50%,0.45)`
    );


    gradient.addColorStop(
        1,
        `hsla(${(t * 360 + 360) % 360},100%,50%,0.45)`
    );


    context.fillStyle =
        gradient;


    context.globalCompositeOperation =
        "screen";


    context.fillRect(
        0,
        0,
        width,
        height
    );


    context.globalCompositeOperation =
        "source-over";

}


/* =========================================================
   HUD
========================================================= */

function drawHUD() {

    ctx.save();

    ctx.font =
        "bold 14px Arial";

    ctx.fillStyle =
        "#00ffff";


    let mode =
        mode3D
            ? "3D Mesh"
            : "2D Quad";


    ctx.fillText(

        `MODE: ${mode} [C / Dual Fist]`,

        12,
        22

    );


    ctx.fillStyle =
        "white";


    ctx.fillText(

        `FILTER: ${currentFilter().toUpperCase()} [Pinch / N / P]`,

        12,
        44

    );


    ctx.fillStyle =
        "#aaa";


    ctx.font =
        "12px Arial";


    ctx.fillText(

        `FPS: ${fps}   Q: Quit   C: Mode   N/P: Filter   S: Screenshot`,

        12,
        PROCESS_HEIGHT - 12

    );


    /*
        Hand tracking indicator.
    */

    if (
        handLandmarker
    ) {

        ctx.fillStyle =
            "#00ff88";


        ctx.fillText(

            "HAND TRACKING: READY",

            PROCESS_WIDTH - 170,
            22

        );

    }


    ctx.restore();

}


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        const key =
            event.key.toLowerCase();


        if (
            key === "q"
        ) {

            stopCamera();


        } else if (
            key === "c"
        ) {

            const now =
                performance.now();


            if (
                now -
                lastModeChange >
                300
            ) {

                mode3D =
                    !mode3D;

                lastModeChange =
                    now;

            }


        } else if (
            key === "n"
        ) {

            nextFilter(1);


        } else if (
            key === "p"
        ) {

            nextFilter(-1);


        } else if (
            key === "s"
        ) {

            takeScreenshot();

        }

    }
);


/* =========================================================
   SCREENSHOT
========================================================= */

function takeScreenshot() {

    const link =
        document.createElement("a");


    link.download =
        `retrolens_${Date.now()}.png`;


    link.href =
        canvas.toDataURL(
            "image/png"
        );


    link.click();

}


/* =========================================================
   STOP CAMERA
========================================================= */

function stopCamera() {

    running =
        false;


    if (
        cameraStream
    ) {

        for (
            const track
            of cameraStream.getTracks()
        ) {

            track.stop();

        }

    }


    cameraStream =
        null;


    startScreen.style.display =
        "flex";


    startButton.disabled =
        false;


    statusText.textContent =
        "Camera offline";

}


/* =========================================================
   START
========================================================= */

startButton.addEventListener(
    "click",
    startCamera
);

</script>
