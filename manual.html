<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>RetroLens Engine</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
}

#video {
    display: none;
}

#canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    background: #000;
}

#startScreen {
    position: fixed;
    inset: 0;
    z-index: 10;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    text-align: center;
    color: white;

    background:
        radial-gradient(
            circle at center,
            #191919 0%,
            #070707 45%,
            #000 100%
        );
}

#startScreen h1 {
    margin: 0 0 10px;
    font-size: clamp(42px, 9vw, 80px);
    letter-spacing: 6px;
}

#startScreen p {
    margin: 0 0 28px;
    color: #999;
}

#startButton {
    padding: 14px 30px;

    border: 1px solid #00ffff;
    border-radius: 6px;

    background: transparent;
    color: #00ffff;

    font-size: 16px;
    cursor: pointer;
}

#startButton:hover {
    background: #00ffff;
    color: #000;
}

#startButton:disabled {
    opacity: 0.5;
}

#status {
    margin-top: 15px;
    color: #888;
    font-size: 13px;
}

#error {
    display: none;
    max-width: 500px;
    margin-top: 15px;
    color: #ff5555;
    font-size: 13px;
}
</style>
</head>

<body>

<video
    id="video"
    autoplay
    muted
    playsinline>
</video>

<canvas id="canvas"></canvas>

<div id="startScreen">

    <h1>RETROLENS</h1>

    <p>Hand-controlled visual portal engine</p>

    <button id="startButton">
        START CAMERA
    </button>

    <div id="status">
        Camera offline
    </div>

    <div id="error"></div>

</div>


<script type="module">

/* =========================================================
   MEDIAPIPE IMPORT
========================================================= */

import {
    HandLandmarker,
    FilesetResolver
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm";


/* =========================================================
   ELEMENTS
========================================================= */

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d", {
    alpha: false
});

const startScreen =
    document.getElementById("startScreen");

const startButton =
    document.getElementById("startButton");

const status =
    document.getElementById("status");

const errorBox =
    document.getElementById("error");


/* =========================================================
   RESOLUTION
========================================================= */

const WIDTH = 640;
const HEIGHT = 360;

canvas.width = WIDTH;
canvas.height = HEIGHT;


/* =========================================================
   STATE
========================================================= */

let cameraStream = null;

let running = false;

let handLandmarker = null;

let hands = [];

let mediaPipeLoading = false;

let lastDetection = 0;

let detectionBusy = false;

let lastPinch = 0;

let lastFistToggle = 0;

let mode3D = false;

let filterIndex = 0;


/* =========================================================
   FILTERS
========================================================= */

const filters = [
    "dual-tone",
    "thermal",
    "sketch",
    "pixelate",
    "glitch",
    "invert",
    "red-channel",
    "edge",
    "blur",
    "cartoon",
    "rainbow-wave"
];


function currentFilter() {
    return filters[filterIndex];
}


function nextFilter(amount = 1) {

    filterIndex =
        (
            filterIndex +
            amount +
            filters.length
        ) % filters.length;

}


/* =========================================================
   START CAMERA
========================================================= */

async function startCamera() {

    startButton.disabled = true;

    status.textContent =
        "Opening camera...";

    errorBox.style.display =
        "none";


    try {

        /*
            CAMERA FIRST.

            No MediaPipe.
            No model.
            No canvas processing.

            Just get the camera.
        */

        cameraStream =
            await navigator.mediaDevices.getUserMedia({

                video: {
                    facingMode: "user",

                    width: {
                        ideal: 640
                    },

                    height: {
                        ideal: 360
                    },

                    frameRate: {
                        ideal: 30,
                        max: 30
                    }
                },

                audio: false

            });


        /*
            Give stream to video.
        */

        video.srcObject =
            cameraStream;


        /*
            Wait until video has dimensions.
        */

        await new Promise(resolve => {

            if (video.readyState >= 2) {

                resolve();

            } else {

                video.onloadedmetadata =
                    () => resolve();

            }

        });


        await video.play();


        /*
            CAMERA IS NOW WORKING.
        */

        running = true;


        /*
            Hide start screen immediately.
        */

        startScreen.style.display =
            "none";


        /*
            Start rendering immediately.
        */

        requestAnimationFrame(
            render
        );


        /*
            NOW load MediaPipe.

            It runs in the background and
            does NOT prevent the camera from appearing.
        */

        loadMediaPipe();


    } catch (error) {

        console.error(
            "Camera error:",
            error
        );


        running = false;

        startButton.disabled = false;

        status.textContent =
            "Camera offline";


        errorBox.style.display =
            "block";

        errorBox.textContent =
            error.name +
            " — " +
            error.message;

    }

}


/* =========================================================
   MEDIAPIPE
========================================================= */

async function loadMediaPipe() {

    if (mediaPipeLoading)
        return;

    mediaPipeLoading = true;


    try {

        /*
            This happens AFTER
            the camera has already started.
        */

        console.log(
            "Loading MediaPipe..."
        );


        const vision =
            await FilesetResolver.forVisionTasks(

                "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"

            );


        handLandmarker =
            await HandLandmarker.createFromOptions(

                vision,

                {

                    baseOptions: {

                        modelAssetPath:
                            "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",

                        delegate: "GPU"

                    },

                    runningMode: "VIDEO",

                    numHands: 2,

                    minHandDetectionConfidence: 0.65,

                    minHandPresenceConfidence: 0.65,

                    minTrackingConfidence: 0.65

                }

            );


        console.log(
            "MediaPipe ready."
        );


    } catch (error) {

        console.error(
            "MediaPipe failed:",
            error
        );

        /*
            Camera continues working even if
            hand tracking fails.
        */

    }

}


/* =========================================================
   RENDER LOOP
========================================================= */

function render(time) {

    if (!running)
        return;


    /*
        Draw camera mirrored.
    */

    ctx.save();

    ctx.translate(
        WIDTH,
        0
    );

    ctx.scale(
        -1,
        1
    );

    ctx.drawImage(
        video,
        0,
        0,
        WIDTH,
        HEIGHT
    );

    ctx.restore();


    /*
        Hand tracking is intentionally
        limited to about 10 FPS.

        Camera itself still renders normally.
    */

    if (

        handLandmarker &&

        !detectionBusy &&

        time - lastDetection > 100

    ) {

        detectHands(time);

    }


    /*
        Draw portal.
    */

    if (hands.length > 0) {
        drawPortal();
    }


    /*
        HUD.
    */

    drawHUD();


    requestAnimationFrame(
        render
    );

}


/* =========================================================
   HAND DETECTION
========================================================= */

function detectHands(time) {

    if (!handLandmarker)
        return;

    detectionBusy = true;

    lastDetection = time;


    try {

        const result =
            handLandmarker.detectForVideo(
                video,
                time
            );


        hands =
            result.landmarks || [];


        processGestures();


    } catch (error) {

        console.warn(
            "Hand detection:",
            error
        );

    }


    detectionBusy = false;

}


/* =========================================================
   GESTURES
========================================================= */

function processGestures() {

    const now =
        performance.now();

    let fists = 0;


    for (
        const hand of hands
    ) {

        /*
            PINCH

            Thumb = 4
            Index = 8
        */

        const pinchDistance =
            distance(
                hand[4],
                hand[8]
            );


        if (

            pinchDistance < 0.075 &&

            now - lastPinch > 500

        ) {

            nextFilter(1);

            lastPinch = now;

        }


        /*
            FIST
        */

        if (
            isFist(hand)
        ) {

            fists++;

        }

    }


    /*
        TWO FISTS
        Toggle 2D / 3D
    */

    if (

        fists === 2 &&

        now - lastFistToggle > 1200

    ) {

        mode3D =
            !mode3D;

        lastFistToggle =
            now;

    }

}


/* =========================================================
   DISTANCE
========================================================= */

function distance(a, b) {

    const dx =
        a.x - b.x;

    const dy =
        a.y - b.y;

    return Math.sqrt(
        dx * dx +
        dy * dy
    );

}


/* =========================================================
   FIST DETECTION
========================================================= */

function isFist(hand) {

    const wrist =
        hand[0];


    const tips = [
        hand[8],
        hand[12],
        hand[16],
        hand[20]
    ];


    let total = 0;


    for (
        const tip of tips
    ) {

        total +=
            distance(
                wrist,
                tip
            );

    }


    return (
        total / tips.length
    ) < 0.135;

}


/* =========================================================
   HAND POINTS
========================================================= */

function getPoints(hand) {

    return [

        convert(hand[4]),
        convert(hand[8]),
        convert(hand[12]),
        convert(hand[16]),
        convert(hand[20])

    ];

}


function convert(point) {

    return {

        x:
            point.x * WIDTH,

        y:
            point.y * HEIGHT

    };

}


/* =========================================================
   PORTAL
========================================================= */

function drawPortal() {

    const handPoints =
        hands.map(
            getPoints
        );


    if (mode3D) {

        draw3D(
            handPoints
        );

    } else {

        draw2D(
            handPoints
        );

    }

}


/* =========================================================
   2D PORTAL
========================================================= */

function draw2D(hands) {

    if (
        hands.length === 2
    ) {

        /*
            Two hands =
            four-corner portal.
        */

        const polygon = [

            hands[0][0],
            hands[0][1],
            hands[1][1],
            hands[1][0]

        ];


        drawFiltered(
            polygon,
            currentFilter()
        );


    } else if (
        hands.length === 1
    ) {

        /*
            One hand =
            smaller portal.
        */

        const polygon = [

            hands[0][0],
            hands[0][1],
            hands[0][2],
            hands[0][4]

        ];


        drawFiltered(
            polygon,
            currentFilter()
        );

    }

}


/* =========================================================
   3D PORTAL
========================================================= */

function draw3D(hands) {

    if (
        hands.length === 2
    ) {

        /*
            Upper portal.
        */

        drawFiltered(

            [

                hands[0][0],
                hands[0][1],
                hands[0][2],
                hands[1][2],
                hands[1][1],
                hands[1][0]

            ],

            currentFilter()

        );


        /*
            Lower portal.
        */

        drawFiltered(

            [

                hands[0][2],
                hands[0][3],
                hands[0][4],
                hands[1][4],
                hands[1][3],
                hands[1][2]

            ],

            filters[
                (
                    filterIndex + 1
                ) % filters.length
            ]

        );

    } else {

        draw2D(hands);

    }

}


/* =========================================================
   FILTERED PORTAL
========================================================= */

function drawFiltered(
    polygon,
    filter
) {

    if (
        polygon.length < 4
    )
        return;


    /*
        Create clipping path.
    */

    ctx.save();

    ctx.beginPath();

    ctx.moveTo(
        polygon[0].x,
        polygon[0].y
    );


    for (
        let i = 1;
        i < polygon.length;
        i++
    ) {

        ctx.lineTo(
            polygon[i].x,
            polygon[i].y
        );

    }


    ctx.closePath();

    ctx.clip();


    /*
        Apply cheap browser-native filters.

        These are dramatically faster than
        manually processing hundreds of
        thousands of pixels with JavaScript.
    */

    switch (filter) {

        case "invert":

            ctx.filter =
                "invert(1)";

            break;


        case "thermal":

            ctx.filter =
                "contrast(1.4) saturate(3) hue-rotate(180deg)";

            break;


        case "sketch":

            ctx.filter =
                "grayscale(1) contrast(2.2) brightness(1.15)";

            break;


        case "blur":

            ctx.filter =
                "blur(8px)";

            break;


        case "red-channel":

            ctx.filter =
                "grayscale(1) sepia(1) saturate(5)";

            break;


        case "cartoon":

            ctx.filter =
                "contrast(1.5) saturate(1.6)";

            break;


        case "dual-tone":

            ctx.filter =
                "contrast(1.5) saturate(1.8)";

            break;


        case "edge":

            ctx.filter =
                "grayscale(1) contrast(3)";

            break;


        default:

            ctx.filter =
                "none";

    }


    /*
        Draw camera through the portal.
    */

    ctx.save();

    ctx.translate(
        WIDTH,
        0
    );

    ctx.scale(
        -1,
        1
    );

    ctx.drawImage(

        video,

        0,
        0,

        WIDTH,
        HEIGHT

    );

    ctx.restore();


    ctx.filter =
        "none";


    /*
        PIXELATE.
    */

    if (
        filter === "pixelate"
    ) {

        /*
            Pixelation approximation using
            canvas image smoothing.
        */

        ctx.imageSmoothingEnabled =
            false;

    }


    /*
        GLITCH.
    */

    if (
        filter === "glitch"
    ) {

        const offset =
            Math.random() * 12 - 6;


        ctx.globalAlpha =
            0.35;


        ctx.translate(
            offset,
            0
        );


        ctx.drawImage(
            video,
            0,
            0,
            WIDTH,
            HEIGHT
        );


        ctx.globalAlpha =
            1;

    }


    /*
        RAINBOW.
    */

    if (
        filter === "rainbow-wave"
    ) {

        const gradient =
            ctx.createLinearGradient(
                0,
                0,
                WIDTH,
                HEIGHT
            );


        const hue =
            (
                performance.now() * 0.05
            ) % 360;


        gradient.addColorStop(
            0,
            `hsla(${hue},100%,50%,0.45)`
        );


        gradient.addColorStop(
            0.5,
            `hsla(${(hue + 120) % 360},100%,50%,0.45)`
        );


        gradient.addColorStop(
            1,
            `hsla(${(hue + 240) % 360},100%,50%,0.45)`
        );


        ctx.fillStyle =
            gradient;


        ctx.fillRect(
            0,
            0,
            WIDTH,
            HEIGHT
        );

    }


    /*
        Restore normal drawing.
    */

    ctx.imageSmoothingEnabled =
        true;


    /*
        White portal border.
    */

    ctx.beginPath();

    ctx.moveTo(
        polygon[0].x,
        polygon[0].y
    );


    for (
        let i = 1;
        i < polygon.length;
        i++
    ) {

        ctx.lineTo(
            polygon[i].x,
            polygon[i].y
        );

    }


    ctx.closePath();


    ctx.strokeStyle =
        "white";

    ctx.lineWidth =
        2;

    ctx.stroke();


    ctx.restore();

}


/* =========================================================
   HUD
========================================================= */

function drawHUD() {

    ctx.save();

    ctx.font =
        "bold 14px Arial";


    ctx.fillStyle =
        "#00ffff";


    ctx.fillText(

        `MODE: ${
            mode3D
                ? "3D Mesh"
                : "2D Quad"
        } [C / Dual Fist]`,

        12,
        22

    );


    ctx.fillStyle =
        "white";


    ctx.fillText(

        `FILTER: ${
            currentFilter().toUpperCase()
        } [Pinch / N / P]`,

        12,
        44

    );


    if (
        handLandmarker
    ) {

        ctx.fillStyle =
            "#00ff88";


        ctx.fillText(
            "HAND TRACKING: READY",
            WIDTH - 175,
            22
        );

    } else {

        ctx.fillStyle =
            "#ffaa00";


        ctx.fillText(
            "HAND TRACKING: LOADING",
            WIDTH - 190,
            22
        );

    }


    ctx.restore();

}


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        const key =
            event.key.toLowerCase();


        if (
            key === "n"
        ) {

            nextFilter(1);

        }


        if (
            key === "p"
        ) {

            nextFilter(-1);

        }


        if (
            key === "c"
        ) {

            mode3D =
                !mode3D;

        }


        if (
            key === "s"
        ) {

            const link =
                document.createElement("a");


            link.download =
                `retrolens_${Date.now()}.png`;


            link.href =
                canvas.toDataURL(
                    "image/png"
                );


            link.click();

        }


        if (
            key === "q"
        ) {

            stopCamera();

        }

    }
);


/* =========================================================
   STOP CAMERA
========================================================= */

function stopCamera() {

    running =
        false;


    if (
        cameraStream
    ) {

        cameraStream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );

    }


    cameraStream =
        null;

    hands = [];


    startScreen.style.display =
        "flex";


    startButton.disabled =
        false;


    status.textContent =
        "Camera offline";

}


/* =========================================================
   START BUTTON
========================================================= */

startButton.addEventListener(
    "click",
    startCamera
);

</script>

</body>
</html>
