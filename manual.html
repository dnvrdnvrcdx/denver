<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>RetroLens Engine</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
}

#video {
    position: fixed;

    width: 100%;
    height: 100%;

    object-fit: cover;

    transform: scaleX(-1);

    display: none;
}

#canvas {
    position: fixed;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    object-fit: contain;

    background: #000;
}

#startScreen {

    position: fixed;

    inset: 0;

    z-index: 10;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

    color: white;

    background:
        radial-gradient(
            circle,
            #171717,
            #000
        );
}

#startScreen h1 {

    margin: 0 0 10px;

    font-size: clamp(
        40px,
        8vw,
        72px
    );

    letter-spacing: 5px;

}

#startScreen p {

    color: #999;

    margin-bottom: 25px;

}

button {

    padding: 14px 28px;

    border: 1px solid #00ffff;

    border-radius: 6px;

    background: transparent;

    color: #00ffff;

    font-size: 16px;

    cursor: pointer;

}

button:hover {

    background: #00ffff;

    color: #000;

}

button:disabled {

    opacity: 0.5;

}

#status {

    margin-top: 15px;

    color: #888;

    font-size: 13px;

}

#error {

    display: none;

    max-width: 500px;

    margin-top: 15px;

    padding: 10px;

    color: #ff5555;

}

</style>
</head>

<body>

<!-- CAMERA -->

<video
    id="video"
    autoplay
    muted
    playsinline>
</video>


<!-- PROCESSING CANVAS -->

<canvas id="canvas"></canvas>


<!-- START SCREEN -->

<div id="startScreen">

    <h1>RETROLENS</h1>

    <p>
        Hand-controlled visual portal engine
    </p>

    <button id="startButton">
        START CAMERA
    </button>

    <div id="status">
        Camera offline
    </div>

    <div id="error"></div>

</div>


<script type="module">


/* =========================================================
   MEDIAPIPE
========================================================= */

import {

    HandLandmarker,

    FilesetResolver

}
from
"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm";


/* =========================================================
   ELEMENTS
========================================================= */

const video =
    document.getElementById(
        "video"
    );

const canvas =
    document.getElementById(
        "canvas"
    );

const ctx =
    canvas.getContext(
        "2d",
        {
            alpha: false
        }
    );

const startScreen =
    document.getElementById(
        "startScreen"
    );

const startButton =
    document.getElementById(
        "startButton"
    );

const status =
    document.getElementById(
        "status"
    );

const errorBox =
    document.getElementById(
        "error"
    );


/* =========================================================
   RESOLUTION
========================================================= */

/*
    640x360 is MUCH easier for an i3-7th gen
    while still looking good on the webpage.
*/

const WIDTH = 640;

const HEIGHT = 360;

canvas.width =
    WIDTH;

canvas.height =
    HEIGHT;


/* =========================================================
   STATE
========================================================= */

let stream = null;

let running = false;

let handLandmarker = null;

let hands = [];

let lastDetection = 0;

let detecting = false;

let lastModeChange = 0;

let lastFilterChange = 0;

let mode3D = false;

let filterIndex = 0;


/* =========================================================
   FILTERS
========================================================= */

const filters = [

    "dual-tone",

    "thermal",

    "sketch",

    "pixelate",

    "glitch",

    "invert",

    "red-channel",

    "edge",

    "blur",

    "cartoon",

    "rainbow-wave"

];


function currentFilter() {

    return filters[
        filterIndex
    ];

}


function nextFilter(amount) {

    filterIndex =

        (
            filterIndex +
            amount +
            filters.length
        )
        %
        filters.length;

}


/* =========================================================
   CAMERA
========================================================= */

async function startCamera() {

    try {

        startButton.disabled =
            true;

        status.textContent =
            "Requesting camera...";


        /*
            IMPORTANT:

            Keep getUserMedia simple.

            This works better across
            Chrome + Safari + iPhone.
        */

        stream =
            await navigator.mediaDevices
                .getUserMedia({

                    video: {

                        facingMode:
                            "user"

                    },

                    audio: false

                });


        video.srcObject =
            stream;


        /*
            Wait for the actual
            video metadata.
        */

        await new Promise(
            resolve => {

                if (
                    video.readyState >= 2
                ) {

                    resolve();

                } else {

                    video.onloadedmetadata =
                        resolve;

                }

            }
        );


        await video.play();


        /*
            Camera is now working.
        */

        running = true;

        startScreen.style.display =
            "none";


        /*
            Start rendering immediately.
        */

        requestAnimationFrame(
            render
        );


        /*
            Load hand tracking
            AFTER camera starts.
        */

        loadHands();


    } catch (err) {

        console.error(err);

        startButton.disabled =
            false;

        status.textContent =
            "Camera offline";

        errorBox.style.display =
            "block";

        errorBox.textContent =
            err.name +
            ": " +
            err.message;

    }

}


/* =========================================================
   MEDIAPIPE
========================================================= */

async function loadHands() {

    try {

        status.textContent =
            "Loading hand tracking...";


        const vision =
            await FilesetResolver
                .forVisionTasks(

                    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"

                );


        handLandmarker =
            await HandLandmarker
                .createFromOptions(

                    vision,

                    {

                        baseOptions: {

                            modelAssetPath:

                                "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",

                            delegate:
                                "GPU"

                        },

                        runningMode:
                            "VIDEO",

                        numHands:
                            2,

                        minHandDetectionConfidence:
                            0.65,

                        minHandPresenceConfidence:
                            0.65,

                        minTrackingConfidence:
                            0.65

                    }

                );


        status.textContent =
            "Hand tracking ready";


    } catch (err) {

        console.error(
            "MediaPipe error:",
            err
        );

    }

}


/* =========================================================
   RENDER LOOP
========================================================= */

function render(time) {

    if (!running)
        return;


    /*
        Draw camera.

        Because the video itself is
        mirrored with CSS, we don't
        need to flip the processing
        image here.
    */

    ctx.save();


    ctx.translate(
        WIDTH,
        0
    );


    ctx.scale(
        -1,
        1
    );


    ctx.drawImage(

        video,

        0,
        0,

        WIDTH,
        HEIGHT

    );


    ctx.restore();


    /*
        Hand detection only every
        ~100ms = around 10 FPS.

        This saves a LOT of CPU.
    */

    if (

        handLandmarker &&

        !detecting &&

        time -
        lastDetection >
        100

    ) {

        detectHands(time);

    }


    /*
        Draw portal.
    */

    drawPortal();


    /*
        HUD.
    */

    drawHUD();


    requestAnimationFrame(
        render
    );

}


/* =========================================================
   HAND DETECTION
========================================================= */

async function detectHands(time) {

    detecting = true;

    lastDetection =
        time;


    try {

        const result =
            handLandmarker
                .detectForVideo(

                    video,

                    time

                );


        hands =
            result.landmarks || [];


        processGestures();


    } catch (err) {

        console.warn(err);

    }


    detecting = false;

}


/* =========================================================
   GESTURES
========================================================= */

function processGestures() {

    const now =
        performance.now();


    let fists = 0;


    for (
        const hand
        of hands
    ) {

        /*
            Thumb + index pinch.
        */

        if (

            distance(
                hand[4],
                hand[8]
            ) < 0.075

        ) {

            if (

                now -
                lastFilterChange >
                400

            ) {

                nextFilter(1);

                lastFilterChange =
                    now;

            }

        }


        /*
            Fist.
        */

        if (
            isFist(hand)
        ) {

            fists++;

        }

    }


    /*
        Two fists =
        switch 2D / 3D
    */

    if (

        fists === 2 &&

        now -
        lastModeChange >
        1200

    ) {

        mode3D =
            !mode3D;

        lastModeChange =
            now;

    }

}


/* =========================================================
   DISTANCE
========================================================= */

function distance(a, b) {

    const dx =
        a.x -
        b.x;

    const dy =
        a.y -
        b.y;


    return Math.sqrt(
        dx * dx +
        dy * dy
    );

}


/* =========================================================
   FIST
========================================================= */

function isFist(hand) {

    const wrist =
        hand[0];


    const tips = [

        hand[8],
        hand[12],
        hand[16],
        hand[20]

    ];


    let total = 0;


    for (
        const tip
        of tips
    ) {

        total +=
            distance(
                wrist,
                tip
            );

    }


    return (

        total /
        tips.length

    ) < 0.135;

}


/* =========================================================
   LANDMARKS
========================================================= */

function points(hand) {

    return [

        point(hand[4]),

        point(hand[8]),

        point(hand[12]),

        point(hand[16]),

        point(hand[20])

    ];

}


function point(p) {

    return {

        x:
            p.x * WIDTH,

        y:
            p.y * HEIGHT

    };

}


/* =========================================================
   PORTAL
========================================================= */

function drawPortal() {

    if (
        hands.length === 0
    )
        return;


    const handPoints =
        hands.map(
            points
        );


    if (
        mode3D
    ) {

        draw3D(
            handPoints
        );

    } else {

        draw2D(
            handPoints
        );

    }

}


/* =========================================================
   2D
========================================================= */

function draw2D(h) {

    if (
        h.length === 2
    ) {

        const quad = [

            h[0][0],
            h[0][1],
            h[1][0],
            h[1][1]

        ];


        drawFiltered(
            quad,
            currentFilter()
        );


    } else if (
        h.length === 1
    ) {

        drawFiltered(

            [

                h[0][0],
                h[0][1],
                h[0][2],
                h[0][4]

            ],

            currentFilter()

        );

    }

}


/* =========================================================
   3D
========================================================= */

function draw3D(h) {

    if (
        h.length === 2
    ) {

        drawFiltered(

            [

                h[0][0],
                h[0][1],
                h[0][2],
                h[1][2],
                h[1][1],
                h[1][0]

            ],

            currentFilter()

        );


        drawFiltered(

            [

                h[0][2],
                h[0][3],
                h[0][4],
                h[1][4],
                h[1][3],
                h[1][2]

            ],

            filters[
                (
                    filterIndex +
                    1
                )
                %
                filters.length
            ]

        );


    } else {

        draw2D(h);

    }

}


/* =========================================================
   FILTERED PORTAL
========================================================= */

function drawFiltered(
    polygon,
    filter
) {

    if (
        polygon.length < 4
    )
        return;


    /*
        Bounding box.

        Only this small region
        gets filtered.
    */

    let minX =
        WIDTH;

    let minY =
        HEIGHT;

    let maxX =
        0;

    let maxY =
        0;


    for (
        const p
        of polygon
    ) {

        minX =
            Math.min(
                minX,
                p.x
            );

        minY =
            Math.min(
                minY,
                p.y
            );

        maxX =
            Math.max(
                maxX,
                p.x
            );

        maxY =
            Math.max(
                maxY,
                p.y
            );

    }


    minX =
        Math.max(
            0,
            Math.floor(minX)
        );

    minY =
        Math.max(
            0,
            Math.floor(minY)
        );

    maxX =
        Math.min(
            WIDTH,
            Math.ceil(maxX)
        );

    maxY =
        Math.min(
            HEIGHT,
            Math.ceil(maxY)
        );


    const w =
        maxX -
        minX;

    const h =
        maxY -
        minY;


    if (
        w < 10 ||
        h < 10
    )
        return;


    /*
        Clip polygon.
    */

    ctx.save();

    ctx.beginPath();

    ctx.moveTo(
        polygon[0].x,
        polygon[0].y
    );


    for (
        let i = 1;
        i < polygon.length;
        i++
    ) {

        ctx.lineTo(
            polygon[i].x,
            polygon[i].y
        );

    }


    ctx.closePath();

    ctx.clip();


    /*
        Lightweight browser filters.

        These are MUCH cheaper than
        manipulating every pixel with JS.
    */

    ctx.save();


    switch (filter) {

        case "invert":

            ctx.filter =
                "invert(1)";

            break;


        case "thermal":

            ctx.filter =
                "contrast(1.4) saturate(3) hue-rotate(180deg)";

            break;


        case "sketch":

            ctx.filter =
                "grayscale(1) contrast(2)";

            break;


        case "blur":

            ctx.filter =
                "blur(8px)";

            break;


        case "red-channel":

            ctx.filter =
                "grayscale(1) sepia(1) saturate(5)";

            break;


        case "cartoon":

            ctx.filter =
                "contrast(1.4) saturate(1.5)";

            break;


        case "dual-tone":

            ctx.filter =
                "contrast(1.5) saturate(1.7)";

            break;


        case "edge":

            ctx.filter =
                "grayscale(1) contrast(3)";

            break;


        default:

            ctx.filter =
                "none";

    }


    /*
        Draw the camera region again
        with the filter applied.

        IMPORTANT:
        The clipping means ONLY the
        portal gets the effect.
    */

    ctx.drawImage(

        video,

        0,
        0,

        WIDTH,
        HEIGHT

    );


    ctx.restore();


    /*
        Rainbow overlay.
    */

    if (
        filter ===
        "rainbow-wave"
    ) {

        const gradient =
            ctx.createLinearGradient(

                minX,
                minY,

                maxX,
                maxY

            );


        const t =
            (
                performance.now() /
                10
            ) % 360;


        gradient.addColorStop(

            0,

            `hsla(${t},100%,50%,0.5)`

        );


        gradient.addColorStop(

            0.5,

            `hsla(${(t + 120) % 360},100%,50%,0.5)`

        );


        gradient.addColorStop(

            1,

            `hsla(${(t + 240) % 360},100%,50%,0.5)`

        );


        ctx.fillStyle =
            gradient;


        ctx.fillRect(

            minX,
            minY,

            w,
            h

        );

    }


    /*
        Border.
    */

    ctx.filter =
        "none";


    ctx.beginPath();

    ctx.moveTo(
        polygon[0].x,
        polygon[0].y
    );


    for (
        let i = 1;
        i < polygon.length;
        i++
    ) {

        ctx.lineTo(
            polygon[i].x,
            polygon[i].y
        );

    }


    ctx.closePath();


    ctx.strokeStyle =
        "white";

    ctx.lineWidth =
        2;

    ctx.stroke();


    ctx.restore();

}


/* =========================================================
   HUD
========================================================= */

function drawHUD() {

    ctx.save();


    ctx.font =
        "bold 14px Arial";


    ctx.fillStyle =
        "#00ffff";


    ctx.fillText(

        `MODE: ${
            mode3D
                ? "3D Mesh"
                : "2D Quad"
        } [C / Dual Fist]`,

        12,
        22

    );


    ctx.fillStyle =
        "white";


    ctx.fillText(

        `FILTER: ${
            currentFilter()
                .toUpperCase()
        } [Pinch / N / P]`,

        12,
        44

    );


    ctx.restore();

}


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        const key =
            event.key.toLowerCase();


        if (
            key === "n"
        ) {

            nextFilter(1);

        }


        if (
            key === "p"
        ) {

            nextFilter(-1);

        }


        if (
            key === "c"
        ) {

            mode3D =
                !mode3D;

        }


        if (
            key === "s"
        ) {

            const link =
                document.createElement(
                    "a"
                );


            link.download =
                "retrolens.png";


            link.href =
                canvas.toDataURL(
                    "image/png"
                );


            link.click();

        }


        if (
            key === "q"
        ) {

            stopCamera();

        }

    }
);


/* =========================================================
   STOP
========================================================= */

function stopCamera() {

    running =
        false;


    if (
        stream
    ) {

        stream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );

    }


    stream =
        null;


    startScreen.style.display =
        "flex";


    startButton.disabled =
        false;


    status.textContent =
        "Camera offline";

}


/* =========================================================
   BUTTON
========================================================= */

startButton.addEventListener(

    "click",

    startCamera

);

</script>

</body>
</html>
```
