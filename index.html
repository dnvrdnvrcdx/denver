<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Matrix Code Rain</title>
  <style>body{margin:0;padding:24px;background:#000000;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;} .wrap{width:1920px;max-width:100%;height:1080px;border-radius:18px;overflow:hidden;} canvas{display:block;width:100%;height:100%;} </style>
</head>
<body>
  <div class="wrap"><canvas id="matrix"></canvas></div>
  <script>(function(){
    var cfg = {"charset":"01","width":1920,"height":1080,"fontSize":16,"speed":35,"fade":0.08000000000000000166533453693773481063544750213623046875,"textColor":"#00ff66","bgColor":"#000000","glow":true,"glowStrength":16,"fullpage":false};
    var canvas = document.getElementById("matrix");
    var ctx = canvas.getContext("2d");
    var dpr = window.devicePixelRatio || 1;
    var cols = 0; var drops = [];
    function rgbFromHex(hex){ return [parseInt(hex.slice(1,3),16), parseInt(hex.slice(3,5),16), parseInt(hex.slice(5,7),16)]; }
    function resize(){
      var rect = canvas.getBoundingClientRect();
      canvas.width = Math.floor(rect.width * dpr);
      canvas.height = Math.floor(rect.height * dpr);
      ctx.setTransform(dpr,0,0,dpr,0,0);
      cols = Math.max(1, Math.floor(rect.width / cfg.fontSize));
      drops = new Array(cols).fill(1);
    }
    function pickChar(){ return cfg.charset.charAt(Math.floor(Math.random()*cfg.charset.length)); }
    function draw(){
      var rect = canvas.getBoundingClientRect();
      var rgb = rgbFromHex(cfg.bgColor);
      ctx.fillStyle = "rgba("+rgb[0]+","+rgb[1]+","+rgb[2]+","+cfg.fade+")";
      ctx.fillRect(0,0,rect.width,rect.height);
      ctx.font = cfg.fontSize + "px monospace";
      ctx.fillStyle = cfg.textColor;
      if(cfg.glow){ ctx.shadowColor = cfg.textColor; ctx.shadowBlur = cfg.glowStrength; } else { ctx.shadowBlur = 0; }
      for(var i=0;i<drops.length;i++){
        ctx.fillText(pickChar(), i*cfg.fontSize, drops[i]*cfg.fontSize);
        if(drops[i]*cfg.fontSize > rect.height && Math.random()>0.975) drops[i] = 0;
        drops[i]++;
      }
    }
    resize(); window.addEventListener("resize", resize); setInterval(draw, cfg.speed);
  })();</script>
</body></html>
